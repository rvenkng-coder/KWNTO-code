name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels that pull request's older run, to save Actions minutes. Each push to
# `main` has a group of its own (its commit), so those runs are never cancelled or queued.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # Shipped dependencies only (developer decision 2026-11-18): an advisory in a build or
      # test tool (GHSA-fc5q-39xc-vjpf, picomatch via Vite and Vitest) does not reach users.
      - run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run test:container
      - run: npm run test:rules

  # A private repository's runner gives Playwright one worker, so the browser suites are split over four
  # runners instead (one browser and half of its tests each). Each runner has its own PocketBase.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # One failing part must not cancel the others: their results are still wanted.
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project ${{ matrix.browser }} --shard ${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  # The timing tests run alone on their own runner. `--no-deps` keeps their projects from pulling in the
  # browser suites that `e2e` runs; one worker keeps the two browsers from timing each other.
  e2e-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps firefox chromium
      - run: npm run test:e2e -- --project perf-chromium --project perf-firefox --no-deps --workers 1
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-performance
          path: playwright-report/
          retention-days: 30

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action lists the pull request's commits through the API on PR runs.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
