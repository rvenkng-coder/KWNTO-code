services:
  pocketbase:
    build: ./backend
    image: kwnto-pocketbase:dev
    ports:
      - "127.0.0.1:8090:8090"
    env_file: .env
    volumes:
      - kwnto-dev-data:/pb/pb_data
      # Edits to migrations and hooks apply without a rebuild.
      - ./backend/pb_migrations:/pb/pb_migrations
      - ./backend/pb_hooks:/pb/pb_hooks
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kwnto-dev-data:
